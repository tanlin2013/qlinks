repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: check-json
    -   id: check-toml
    -   id: check-merge-conflict
    -   id: check-case-conflict
    -   id: detect-private-key
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files
        args: ['--maxkb=50000']

-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
    -   id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]

-   repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.3
    hooks:
    -   id: commitizen
    -   id: commitizen-branch
        stages: [pre-push]

-   repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
    -   id: nbstripout
        files: \.ipynb$

-   repo: local
    hooks:
    -   id: cruft-check
        name: cruft-check
        entry: uv run cruft check
        language: system
        pass_filenames: false
        stages: [pre-push]
    -   id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
        stages: [pre-push]
    -   id: repository-health
        name: repository-health
        entry: uv run python tools/repository_health.py --check --quiet
        language: system
        pass_filenames: false
        stages: [pre-commit]
    -   id: test-health
        name: test-health
        entry: uv run python tools/test_health.py --check --local --quiet
        language: system
        pass_filenames: false
        stages: [pre-push]
