name: Setup Python and uv
description: Set up Python, uv, system dependencies, and the project environment.

inputs:
  python-version:
    description: Python version to install.
    required: true
  uv-version:
    description: uv version to install.
    required: true
  cache-prefix:
    description: Cache suffix for this workflow/job.
    required: true
  system-packages:
    description: Whitespace-separated apt packages to install before project dependencies.
    required: false
    default: ""
  install-command:
    description: Optional command used to sync project dependencies after setup.
    required: false
    default: ""
  compile-paths:
    description: Optional whitespace-separated paths to compile before dependency installation.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Compile source tree
      if: inputs.compile-paths != ''
      shell: bash
      run: python -m compileall -q ${{ inputs.compile-paths }}

    - name: Install missing system dependencies
      if: inputs.system-packages != ''
      shell: bash
      run: |
        set -euo pipefail

        read -r -a requested <<< "${{ inputs.system-packages }}"
        missing=()
        for package in "${requested[@]}"; do
          if ! dpkg-query -W -f='${db:Status-Abbrev}' "${package}" 2>/dev/null | grep -q '^ii'; then
            missing+=("${package}")
          fi
        done

        if ((${#missing[@]} == 0)); then
          echo "All requested system packages are already installed."
          exit 0
        fi

        echo "Missing system packages: ${missing[*]}"

        install_missing() {
          sudo env DEBIAN_FRONTEND=noninteractive timeout 60s \
            apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o DPkg::Lock::Timeout=20 \
              -o Dpkg::Use-Pty=0 \
              install -y --no-install-recommends "${missing[@]}"
        }

        # GitHub-hosted runners already carry usable apt indexes. Avoid a fresh
        # mirror-wide `apt-get update` on the normal path; it has been our main
        # source of intermittent setup stalls. Refresh indexes only if the
        # direct installation fails, then retry once.
        if install_missing; then
          exit 0
        fi

        echo "::warning::Direct apt install failed; refreshing package indexes once before retrying."
        sudo env DEBIAN_FRONTEND=noninteractive timeout 60s \
          apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
        install_missing

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
        cache-suffix: ${{ inputs.cache-prefix }}-py${{ inputs.python-version }}

    - name: Install dependencies
      if: inputs.install-command != ''
      shell: bash
      run: ${{ inputs.install-command }}
