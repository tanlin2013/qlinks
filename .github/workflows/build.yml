name: Docker build

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      default-python: ${{ steps.versions.outputs.default-python }}
      uv-version: ${{ steps.versions.outputs.uv-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install CI helper dependency
        run: python -m pip install packaging

      - name: Read versions
        id: versions
        run: python .github/scripts/ci_versions.py

  pr-smoke:
    if: github.event_name == 'pull_request'
    needs: versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Native Cairo and notebook runtime dependencies belong to the container
      # boundary. Build the same feature set used by the published notebook image
      # so nbconvert/runtime regressions are caught before merge.
      - name: Build notebook drawing runtime image for PR smoke test
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=docker-runtime
          cache-to: type=gha,mode=max,scope=docker-runtime
          push: false
          load: true
          build-args: |
            PYTHON_VERSION=${{ needs.versions.outputs.default-python }}
            UV_VERSION=${{ needs.versions.outputs.uv-version }}
            QLINKS_EXTRAS=notebook drawing storage
          tags: qlinks:ci-runtime

      - name: Smoke test bind mount, notebook runtime, and Cairo drawing backend
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace/qlinks" \
            --workdir /workspace/qlinks \
            qlinks:ci-runtime \
            bash -c '
              set -euo pipefail
              python -c "import sys, cairo, igraph, matplotlib, nbconvert, lxml.html.clean, qlinks; assert sys.executable == '\''/opt/qlinks-venv/bin/python'\'', sys.executable; print('\''bind-mounted notebook/drawing environment OK:'\'', sys.executable)"
              uv sync --locked --group notebook --group docs --extra storage --extra drawing
              python scripts/docker/verify_optional_environment.py --extras "notebook drawing storage"
              QLINKS_TEST_COVERAGE=0 scripts/dev/test.sh fast tests/visualizer/test_hamiltonian_graph.py
            '

  publish:
    if: github.event_name == 'push'
    needs: versions
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: runtime
            tag-suffix: ""
            floating-tag: latest
            python-version: ${{ needs.versions.outputs.default-python }}
            extras: ""
          - variant: notebook
            tag-suffix: -notebook
            floating-tag: notebook
            python-version: ${{ needs.versions.outputs.default-python }}
            extras: notebook drawing storage
          - variant: tn-notebook
            tag-suffix: -tn-notebook
            floating-tag: tn-notebook
            python-version: "3.13"
            extras: notebook tn drawing storage

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/qlinks
          tags: |
            type=ref,event=branch,suffix=${{ matrix.tag-suffix }}
            type=ref,event=tag,suffix=${{ matrix.tag-suffix }}
            type=sha,format=long,suffix=${{ matrix.tag-suffix }}
            type=raw,value={{date 'YYYYMMDD-hhmmss' tz='Asia/Taipei'}}${{ matrix.tag-suffix }}
            type=raw,value=${{ matrix.floating-tag }},enable={{is_default_branch}}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=docker-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.variant }}
          push: true
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
            UV_VERSION=${{ needs.versions.outputs.uv-version }}
            QLINKS_EXTRAS=${{ matrix.extras }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
