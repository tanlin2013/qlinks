name: Refresh Ray lock marker

on:
  push:
    branches:
      - agent/uv-ruff-migration
    paths:
      - .github/workflows/refresh-ray-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uv-ruff-migration
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Refresh lockfile
        run: uv lock
      - name: Commit lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh uv lock for Ray Python marker"
          git push origin HEAD:agent/uv-ruff-migration
