name: Release

on:
  push:
    branches:
      - 'releases/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish the built distributions to TestPyPI.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      default-python: ${{ steps.versions.outputs.default-python }}
      uv-version: ${{ steps.versions.outputs.uv-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install CI helper dependency
        run: python -m pip install packaging

      - name: Read versions
        id: versions
        run: python scripts/ci_versions.py

  package:
    name: Build and validate distributions
    needs: versions
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ needs.versions.outputs.default-python }}
          uv-version: ${{ needs.versions.outputs.uv-version }}
          cache-prefix: release-package
          compile-paths: qlinks tests scripts
          install-command: uv sync --locked --no-default-groups

      - name: Validate release metadata
        run: uv run --no-default-groups python scripts/validate_release.py

      - name: Check uv lockfile
        run: uv lock --check

      - name: Build source and wheel distributions
        run: uv build

      - name: Check distribution metadata
        run: |
          uv pip install --system twine
          python -m twine check dist/*

      - name: Smoke test built wheel
        shell: bash
        run: |
          python -m venv /tmp/qlinks-wheel-smoke
          uv pip install --python /tmp/qlinks-wheel-smoke/bin/python dist/*.whl
          /tmp/qlinks-wheel-smoke/bin/python - <<'PY'
          import qlinks

          print(f"Imported qlinks {qlinks.__version__}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Build and push GHCR image (${{ matrix.variant }})
    needs:
      - versions
      - package
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: runtime
            tag-suffix: ""
            floating-tag: latest
            python-version: ${{ needs.versions.outputs.default-python }}
            extras: ""
          - variant: notebook
            tag-suffix: -notebook
            floating-tag: notebook
            python-version: ${{ needs.versions.outputs.default-python }}
            extras: notebook drawing storage
          - variant: tn-notebook
            tag-suffix: -tn-notebook
            floating-tag: tn-notebook
            python-version: "3.13"
            extras: notebook tn drawing storage

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.tag-suffix }}
            type=ref,event=tag,suffix=${{ matrix.tag-suffix }}
            type=sha,format=long,suffix=${{ matrix.tag-suffix }}
            type=raw,value=${{ matrix.floating-tag }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=release-docker-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=release-docker-${{ matrix.variant }}
          push: true
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
            UV_VERSION=${{ needs.versions.outputs.uv-version }}
            QLINKS_EXTRAS=${{ matrix.extras }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish_testpypi:
    name: Publish to TestPyPI
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/project/qlinks/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/qlinks/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
