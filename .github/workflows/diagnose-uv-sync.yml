name: Diagnose uv sync

on:
  push:
    branches:
      - agent/uv-ruff-migration
    paths:
      - .github/workflows/diagnose-uv-sync.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Diagnose locked sync
        shell: bash
        run: |
          set +e
          output="$(uv sync --locked 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [[ $status -ne 0 ]]; then
            message="${output//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=uv sync failed on Python 3.14::$message"
          fi
          exit "$status"
