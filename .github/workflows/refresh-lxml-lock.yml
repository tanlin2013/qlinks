name: Refresh lxml lock

on:
  push:
    branches: ["agent/lxml6-doc-ci"]
    paths:
      - ".github/workflows/refresh-lxml-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.5
          enable-cache: false

      - name: Refresh only lxml in uv.lock
        run: |
          uv lock --upgrade-package lxml
          if git diff --quiet -- uv.lock; then
            echo "Expected uv.lock to change after the lxml constraint update." >&2
            exit 1
          fi

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: refresh lockfile for lxml 6"
          git push
