name: PRIMME smoke

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/primme-smoke.yml"
      - "experimental/jobs/qdm_folded_backend_comparison.py"
      - "experimental/jobs/qdm_resumable_spectrum.py"
      - "experimental/jobs/qdm_ritz_reconstruction.py"
      - "experimental/jobs/qdm_checkerboard_large_strip.py"
      - "experimental/jobs/qdm_parity_backend_worker.py"
      - "experimental/jobs/qdm_parity_evidence.py"
      - "experimental/jobs/qdm_sec7_fixed_o1.py"
      - "experimental/jobs/qdm_checkerboard_symmetry.py"
      - "experimental/jobs/qdm_resume_site/**"
      - "scripts/docker/build_primme_evidence_image.sh"
      - "scripts/docker/verify_optional_environment.py"
      - "scripts/docker/verify_primme_evidence_runtime.py"
      - "scripts/docker/verify_primme_blas_runtime.py"
      - "tests/experimental/test_evidence_cache.py"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/primme-smoke.yml"
      - "experimental/jobs/qdm_folded_backend_comparison.py"
      - "experimental/jobs/qdm_resumable_spectrum.py"
      - "experimental/jobs/qdm_ritz_reconstruction.py"
      - "experimental/jobs/qdm_checkerboard_large_strip.py"
      - "experimental/jobs/qdm_parity_backend_worker.py"
      - "experimental/jobs/qdm_parity_evidence.py"
      - "experimental/jobs/qdm_sec7_fixed_o1.py"
      - "experimental/jobs/qdm_checkerboard_symmetry.py"
      - "experimental/jobs/qdm_resume_site/**"
      - "scripts/docker/build_primme_evidence_image.sh"
      - "scripts/docker/verify_optional_environment.py"
      - "scripts/docker/verify_primme_evidence_runtime.py"
      - "scripts/docker/verify_primme_blas_runtime.py"
      - "tests/experimental/test_evidence_cache.py"
  workflow_dispatch:

concurrency:
  group: primme-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  primme:
    name: Python 3.13 PRIMME evidence runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PRIMME evidence image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=docker-primme-smoke
          cache-to: type=gha,mode=max,scope=docker-primme-smoke
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            PYTHON_VERSION=3.13
            QLINKS_EXTRAS=notebook primme
            PRIMME_VERSION=3.2.3
          tags: qlinks:ci-primme
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify PRIMME import, solve, warm start, and cache reuse
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace/qlinks" \
            --workdir /workspace/qlinks \
            qlinks:ci-primme \
            bash -c '
              set -euo pipefail
              python scripts/docker/verify_optional_environment.py --extras "notebook primme"
              python scripts/docker/verify_primme_blas_runtime.py --require-openblas
              python scripts/docker/verify_primme_evidence_runtime.py
            '

      - name: Validate 4x4 parity and compare ARPACK/PRIMME on 8x4 QDM
        run: |
          rm -rf output/primme-qdm-compare
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace/qlinks" \
            --workdir /workspace/qlinks \
            qlinks:ci-primme \
            python experimental/jobs/qdm_folded_backend_comparison.py \
              --output-root /workspace/qlinks/output/primme-qdm-compare \
              --repeats 1,2 \
              --budgets 16,32 \
              --timeout 600

      # Publish the exact local image that passed both numerical checks above.
      # Pull requests never receive registry credentials or publish image tags.
      - name: Login to DockerHub for tested PRIMME publication
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested PRIMME image
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/qlinks
        run: |
          set -euo pipefail
          revision_tag="${REGISTRY_IMAGE}:sha-${GITHUB_SHA}-notebook-primme"
          floating_tag="${REGISTRY_IMAGE}:notebook-primme"
          docker tag qlinks:ci-primme "${revision_tag}"
          docker tag qlinks:ci-primme "${floating_tag}"
          docker push "${revision_tag}"
          docker push "${floating_tag}"
          digest_ref="$(docker image inspect "${revision_tag}" --format '{{index .RepoDigests 0}}')"
          {
            echo '### Tested PRIMME image published (linux/amd64)'
            echo "- Revision tag: \`${revision_tag}\`"
            echo "- Floating tag: \`${floating_tag}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Digest reference: \`${digest_ref}\`"
            echo 'The provider audit, cache/refinement smoke test and physical QDM comparison passed.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload physical comparison summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qdm-arpack-primme-small-physical
          if-no-files-found: warn
          path: |
            output/primme-qdm-compare/summary.json
            output/primme-qdm-compare/parity_preflight/qdm_parity_exact_audit.json
            output/primme-qdm-compare/parity_preflight/qdm_parity_phase_window_systematics.csv
            output/primme-qdm-compare/qdm_folded_backend_comparison.csv
            output/primme-qdm-compare/arpack/qdm_checkerboard_L12_spectral_convergence.csv
            output/primme-qdm-compare/primme/qdm_checkerboard_L12_spectral_convergence.csv
