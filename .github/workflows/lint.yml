name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      default-python: ${{ steps.versions.outputs.default-python }}
      uv-version: ${{ steps.versions.outputs.uv-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install CI helper dependency
        run: python -m pip install packaging

      - name: Read versions
        id: versions
        run: python .github/scripts/ci_versions.py

  blocking:
    needs: versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ needs.versions.outputs.default-python }}
          uv-version: ${{ needs.versions.outputs.uv-version }}
          cache-prefix: lint-blocking
          system-packages: build-essential pkg-config libxml2-dev libxslt1-dev zlib1g-dev
          install-command: uv sync --locked

      - name: Blocking lint
        run: ./scripts/dev/lint_blocking.sh

  advisory:
    needs: versions
    runs-on: ubuntu-latest
    continue-on-error: true  # mypy/security reports are advisory for now.

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ needs.versions.outputs.default-python }}
          uv-version: ${{ needs.versions.outputs.uv-version }}
          cache-prefix: lint-advisory
          system-packages: build-essential pkg-config libxml2-dev libxslt1-dev zlib1g-dev
          install-command: uv sync --locked

      - name: Advisory lint
        run: ./scripts/dev/lint_advisory.sh
