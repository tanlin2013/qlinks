name: Doc

on: [push, pull_request]

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      default-python: ${{ steps.versions.outputs.default-python }}
      uv-version: ${{ steps.versions.outputs.uv-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install CI helper dependency
        run: python -m pip install packaging

      - name: Read versions
        id: versions
        run: python scripts/ci_versions.py

  build:
    needs: versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ needs.versions.outputs.default-python }}
          uv-version: ${{ needs.versions.outputs.uv-version }}
          cache-prefix: docs
          system-packages: build-essential pkg-config libxml2-dev libxslt1-dev zlib1g-dev pandoc
          install-command: uv sync --locked --no-default-groups --group docs

      - name: Build Sphinx doc and architecture diagnosis
        run: uv run --no-default-groups --group docs make -C docs html

      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: qlinks-docs-${{ github.sha }}
          path: docs/build/html
          if-no-files-found: error
          retention-days: 3

      - name: Upload architecture diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: qlinks-architecture-${{ github.sha }}
          path: |
            docs/build/html/_static/architecture/qlinks-architecture.html
            docs/build/html/_static/architecture/qlinks-architecture.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download documentation site
        uses: actions/download-artifact@v4
        with:
          name: qlinks-docs-${{ github.sha }}
          path: docs/build/html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
