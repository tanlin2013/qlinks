name: Doc

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Read versions
        id: versions
        run: |
          python -m pip install packaging
          python scripts/ci_versions.py

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ steps.versions.outputs.default-python }}
          uv-version: ${{ steps.versions.outputs.uv-version }}
          cache-prefix: docs
          install-command: uv sync --locked --no-default-groups --group docs

      - name: Build Sphinx doc and architecture diagnosis
        env:
          QLINKS_DOCS_VIEWCODE: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: uv run --no-default-groups --group docs make -C docs html

      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: qlinks-docs-${{ github.sha }}
          path: docs/build/html
          if-no-files-found: error
          retention-days: 3

      - name: Upload architecture diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: qlinks-architecture-${{ github.sha }}
          path: |
            docs/build/html/_static/architecture/qlinks-architecture.html
            docs/build/html/_static/architecture/qlinks-architecture.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download documentation site
        uses: actions/download-artifact@v4
        with:
          name: qlinks-docs-${{ github.sha }}
          path: docs/build/html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
