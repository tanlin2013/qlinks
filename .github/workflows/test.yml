name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      default-python: ${{ steps.versions.outputs.default-python }}
      uv-version: ${{ steps.versions.outputs.uv-version }}
      compatibility-python-matrix: ${{ steps.versions.outputs.compatibility-python-matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Install CI helper dependency
        run: python -m pip install packaging

      - name: Read versions
        id: versions
        run: python scripts/ci_versions.py

  fast:
    name: Fast tests with coverage
    needs: versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ needs.versions.outputs.default-python }}
          uv-version: ${{ needs.versions.outputs.uv-version }}
          cache-prefix: test-fast
          compile-paths: qlinks tests
          system-packages: >-
            build-essential gfortran libblas-dev liblapack-dev pkg-config
            libcairo2-dev libxml2-dev libxslt1-dev zlib1g-dev
          install-command: uv sync --locked --extra storage --extra drawing

      - name: Run fast test lane
        env:
          QLINKS_COVERAGE_XML: "1"
        run: scripts/test.sh fast

      - name: Check test-suite health
        run: |
          uv run python tools/test_health.py \
            --check \
            --json "${RUNNER_TEMP}/test-health.json" \
            --markdown "${RUNNER_TEMP}/test-health.md" \
            --quiet
          cat "${RUNNER_TEMP}/test-health.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Report coverage
        if: github.ref_name == 'main'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  compatibility:
    name: Fast compatibility (Python ${{ matrix.python-version }})
    needs: versions
    if: needs.versions.outputs.compatibility-python-matrix != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.versions.outputs.compatibility-python-matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ needs.versions.outputs.uv-version }}
          cache-prefix: test-compatibility
          compile-paths: qlinks tests
          system-packages: build-essential gfortran libblas-dev liblapack-dev pkg-config
          install-command: uv sync --locked --extra storage

      - name: Run fast test lane without coverage
        env:
          QLINKS_TEST_COVERAGE: "0"
        run: scripts/test.sh fast

  integration:
    name: Integration tests
    needs: versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ needs.versions.outputs.default-python }}
          uv-version: ${{ needs.versions.outputs.uv-version }}
          cache-prefix: test-integration
          compile-paths: qlinks tests
          system-packages: >-
            build-essential gfortran libblas-dev liblapack-dev pkg-config
            libcairo2-dev libxml2-dev libxslt1-dev zlib1g-dev
          install-command: uv sync --locked --extra storage --extra drawing

      - name: Run integration test lane
        run: scripts/test.sh integration

  distributed:
    name: Ray backend (Python ${{ needs.versions.outputs.default-python }})
    needs: versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ needs.versions.outputs.default-python }}
          uv-version: ${{ needs.versions.outputs.uv-version }}
          cache-prefix: test-distributed
          compile-paths: qlinks tests
          install-command: uv sync --locked --extra distributed

      - name: Run Ray integration test
        env:
          # Ray >=2.47 otherwise re-enters workers through `uv run`; see ray-project/ray#53848.
          RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
        run: scripts/test.sh integration tests/test_distributed.py

  tensor-network:
    name: Tensor-network backend (Python 3.13)
    needs: versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          uv-version: ${{ needs.versions.outputs.uv-version }}
          cache-prefix: test-tn
          compile-paths: qlinks tests
          system-packages: build-essential gfortran libblas-dev liblapack-dev pkg-config
          install-command: uv sync --locked --extra tn

      - name: Verify tensor-network environment
        run: uv run python scripts/verify_tn_environment.py

      - name: Run tensor-network integration tests
        run: scripts/test.sh integration tests/caging/test_tensor_network.py
