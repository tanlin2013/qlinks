[project]
name = "qlinks"
version = "1.0.3"
description = "Quantum link model"
authors = [
    { name = "Tan Tao-Lin", email = "tanlin2013@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "tqdm>=4.63,<5",
    "rich>=15,<16",
    "numpy>=2.2,<2.4",
    "scipy>=1.15,<2",
    "pandas>=3,<4",
    "networkx>=3,<4",
    "matplotlib>=3.6.3,<4",
]

[project.optional-dependencies]
automorphism = ["pynauty>=2.8.6,<3"]
cpsat = ["ortools>=9.11,<10"]
cupy = [
    "cupy-cuda12x>=14,<15; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
distributed = ["ray==2.55.0"]
drawing = [
    "pyvis>=0.3,<0.4",
    "plotly>=6,<7",
    "pycairo>=1.25,<2",
    "igraph>=1,<2",
]
storage = [
    "h5py>=3.8,<4",
    "pyarrow>=23,<24",
]
tn = [
    "quimb>=1.14,<2; python_version < '3.14'",
    "autograd>=1.9.1,<2; python_version < '3.14'",
    "numba>=0.62,<0.63; python_version < '3.14'",
    "llvmlite>=0.45,<0.46; python_version < '3.14'",
]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "commitizen>=4,<5",
    "vulture>=2.4,<3",
    "bandit>=1.7.4,<2",
    "safety>=3,<4",
    "ruff==0.16.0",
    "mypy>=1,<2",
    "jupyter>=1,<2",
    "jupyterlab>=3,<4",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-mock>=3.9,<4",
    "hypothesis[numpy]>=6.68.2,<7",
    "cruft>=2.12,<3",
    "pandas-stubs>=3,<4",
    "scipy-stubs>=1.16,<2",
]
docs = [
    "sphinx>=7,<8",
    "sphinx-book-theme>=1,<2",
    "nbsphinx>=0.9,<1",
    "m2r2>=0.3.2,<0.4",
    "docutils==0.20.1",
    "lxml[html_clean]>=5,<6",
]

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.uv]
required-version = ">=0.12,<0.13"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "docs/build",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "N",
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N806"]

[tool.ruff.format]
docstring-code-format = false

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "-m",
    "not integration and not scientific and not manual and not gpu",
]
testpaths = ["tests"]
filterwarnings = [
    "error::Warning:qlinks\\..*",
]
markers = [
    "integration: small cross-module or optional-backend workflow tests",
    "scientific: expensive validation of a research claim; scheduled or explicitly dispatched",
    "manual: tests requiring explicit local activation or human inspection",
    "gpu: tests requiring a real CUDA-capable GPU runtime",
]

[tool.mypy]
ignore_missing_imports = true
strict_optional = false

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
omit = ["*tests*"]

[tool.bandit]
skips = ["B101"]

[tool.cruft]
skip = []
